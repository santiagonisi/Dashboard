<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

<h2 class="mb-4">Editar usuario</h2>

<form method="POST" class="row g-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="col-md-4">
        <label class="form-label">Usuario</label>
        <input type="text" name="usuario" class="form-control" value="{{ user.usuario }}" required>
    </div>

    <div class="col-md-4">
        <label class="form-label">Contraseña <small class="text-muted">(dejar en blanco para mantener)</small></label>
        <input type="password" name="password" class="form-control">
    </div>

    <div class="col-md-4">
        <label class="form-label">Rol</label>
        <select name="rol" class="form-select">
            {% for rol in roles %}
            <option value="{{ rol }}" {% if user.rol == rol %}selected{% endif %}>{{ rol }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="col-md-2 form-check mt-2">
        <input type="checkbox" class="form-check-input" id="activo" name="activo" value="1" {% if user.activo %}checked{% endif %}>
        <label for="activo" class="form-check-label">Activo</label>
    </div>

    <div class="col-md-4 form-check mt-2">
        <input type="checkbox" class="form-check-input" id="rrhh_extra_access" name="rrhh_extra_access" value="1" {% if user.rrhh_extra_access %}checked{% endif %}>
        <label for="rrhh_extra_access" class="form-check-label">Acceso adicional a RRHH (fuera del rol)</label>
    </div>

    <div class="col-12 mt-3">
        <button class="btn btn-dark">Guardar</button>
        <a href="{{ url_for('admin_usuarios') }}" class="btn btn-secondary ms-2">Cancelar</a>
    </div>
</form>

</body>
</html>
